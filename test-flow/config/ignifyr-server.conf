# Ignifyr server config for the manual test-flow stack.
# Workspace-rooted: all repositories, the db folder, and Spark checkpoints live under /workspace
# (a bind mount), and the FHIR-definitions endpoint points at the repofyr container.
ignifyr {
  # Base for relative file-system readings (job dataFolderPath, terminology folders).
  context-path = "/workspace/"

  mappings = {
    repository = { folder-path = "/workspace/mappings" }
    schemas = {
      repository = { folder-path = "/workspace/schemas" }
      fhir-version = "5.0.0"
    }
    contexts = { repository = { folder-path = "/workspace/mapping-contexts" } }
    timeout = 30 seconds
  }

  mapping-jobs = {
    repository = { folder-path = "/workspace/mapping-jobs" }
  }

  terminology-systems = { folder-path = "/workspace/terminology-systems" }

  archiving = {
    erroneous-records-folder = "/workspace/erroneous-records-folder"
    archive-folder = "/workspace/archive-folder"
    stream-archiving-frequency = 5000
  }

  fhir-server-writer { batch-group-size = 50 }

  db-path = "/workspace/ignifyr-db"

  # Keep only the custom mapping functions library (no external RxNorm calls during the flow).
  functionLibraries {
    cst { className = "io.ignifyr.common.util.CustomMappingFunctionsFactory" }
  }
}

fhir = {
  fhir-version = "R5"
  definitions-root-urls = null
  # Use the server's bundled base FHIR R5 definitions. Setting a definitions-fhir-endpoint here would
  # switch to "read definitions from a remote FHIR server" mode, which additionally REQUIRES
  # definitions-root-urls to be set, and aborts startup otherwise. The flow's mapping uses the
  # Ext-patient schema from the schema repository, so no remote definitions source is needed.
  definitions-fhir-endpoint = null
  fhir-endpoint-auth = { method = null }
  context-path = "/workspace/"
  profiles-path = null
  valuesets-path = null
  codesystems-path = null
}

webserver = {
  host = 0.0.0.0
  port = 8085
  base-uri = ignifyr
  ssl { keystore = null, password = null }
}

spark = {
  app.name = "Ignifyr Test-Flow Server"
  master = "local[4]"
  ui.enabled = "false"
  checkpoint-dir = "/workspace/checkpoint"
}

akka = {
  daemonic = "on"
  http = {
    parsing = { max-header-value-length = 82k }
    server = {
      server-header = Ignifyr Server
      parsing { uri-parsing-mode = relaxed, max-content-length = 8m }
      request-timeout = 120 s
      idle-timeout = 120 s
      remote-address-header = on
    }
  }
}

# NOTE: the `ignifyr-redcap { }` block is intentionally omitted. Its presence would add the /redcap
# proxy routes (and a startup probe against the external tofhir-redcap service). This flow simulates
# REDCap by publishing directly to Kafka, so the proxy is not needed.
