# Fronts the test-flow stack so the web UI and API share one origin (no CORS), mirroring the
# dt4h proxy layout: the Angular SPA is served under /dt4h/ignifyr, its API calls (relative "api")
# land on /dt4h/ignifyr/api and are proxied to the ignifyr server, and the FHIR server is exposed
# under /dt4h/repofyr.
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 300s;
  proxy_read_timeout 300s;

  server {
    listen 80;
    server_name localhost;

    # API — must be matched before the SPA location (longer prefix wins).
    location /dt4h/ignifyr/api {
      proxy_pass http://ignifyr:8085/ignifyr;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 16M;
    }

    # Kibana (only up with --with-efk). Kibana runs with server.basePath=/dt4h/ignifyr/kibana and
    # rewriteBasePath=false (default), so it serves at the root internally — critically, its own
    # init-script can reach /api/status and import the Executions dashboard — while generating
    # base-path-prefixed URLs. This location therefore STRIPS the /dt4h/ignifyr/kibana prefix before
    # proxying. A deferred DNS resolver keeps nginx starting even when Kibana is absent (EFK off).
    location ~ ^/dt4h/ignifyr/kibana/(?<kbpath>.*)$ {
      resolver 127.0.0.11 valid=30s;
      set $kibana_upstream kibana:5601;
      proxy_pass http://$kibana_upstream/$kbpath$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # The Angular SPA (built with --base-href=/dt4h/ignifyr/), served from the host-built dist.
    location /dt4h/ignifyr {
      alias /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /dt4h/ignifyr/index.html;
    }

    # Direct access to the FHIR server, if you want to browse it through the proxy too.
    location /dt4h/repofyr {
      proxy_pass http://repofyr:8080/fhir;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
