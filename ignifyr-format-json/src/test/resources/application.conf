# Ignifyr configurations (format-json suites read their own file fixtures)
ignifyr {

  # A path to a file/directory from where any File system readings should use within the mappingjob definition.
  context-path = "testcontext"

  mappings = {
    repository = {
      folder-path = "/test-mappings"
    }
    schemas = {
      repository = {
        folder-path = "/test-schemas"
      }
    }
    timeout = 5 seconds
  }

  fhir-server-writer {
    batch-group-size = 20
  }

  db = "db"
}

# Spark configurations
spark = {
  app.name = "Ignifyr format-json TEST"
  master = "local[4]"
  checkpoint-dir = "checkpoint"
}

akka = {
  daemonic = "on"
}
