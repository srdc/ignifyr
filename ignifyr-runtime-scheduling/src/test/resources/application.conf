# Ignifyr configurations (runtime-scheduling suites; fixtures come from ignifyr-testkit)
ignifyr {

  # A path to a file/directory from where any File system readings should use within the mappingjob definition.
  context-path = "testcontext"

  mappings = {
    # The repository where the mapping definitions are kept (shipped by ignifyr-testkit).
    repository = {
      folder-path = "/test-mappings"
    }
    schemas = {
      repository = {
        folder-path = "/test-schemas"
      }
    }
    # Timeout for each mapping execution on an individual input record
    timeout = 5 seconds
  }

  # Settings for FHIR repository writer
  fhir-server-writer {
    batch-group-size = 20
  }

  # Database folder of Ignifyr (the scheduling test passes its own temp path to the provider)
  db = "db"
}

# Spark configurations
spark = {
  app.name = "Ignifyr runtime-scheduling TEST"
  master = "local[4]"
  checkpoint-dir = "checkpoint"
}

akka = {
  daemonic = "on"
}
