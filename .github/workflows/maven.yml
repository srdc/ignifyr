# CI runs the two test tiers as separate jobs (see test-flow/README.md):
#
#   short  ->  mvn -B test                      fast, NO Docker
#   long   ->  mvn -B verify -DskipITs=false     integration tier (TestContainers: MongoDB + srdc/onfhir:r5 + Kafka) + the packaged edition checks
#
# The long tier is opt-in locally (`${skipITs}` defaults to true, so a plain `mvn install`/`verify`
# stays short and Docker-free; run `mvn verify -DskipITs=false` when you want it) and mandatory on
# every pull request. Pushes only get the two fast jobs, since anything reaching a protected branch
# has already been through a PR that ran the long tier.
#
# A push to main also deploys the community -SNAPSHOT modules to SRDC Nexus, which is where the
# enterprise edition resolves them from between releases. Releases are deployed by hand (RELEASING.md).

name: Java CI with Maven

on:
  # No branch filter: a PR into *any* base branch must run the long tier. Restricting this to `main`
  # silently disables CI for the integration/feature branches we actually open PRs against.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiers:
    name: Test-tier integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check test tiers
        run: bash test-flow/check-test-tiers.sh

  short:
    name: Short tier (unit, no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          #cache: maven
      - name: Unit tests
        run: mvn -B test

  # Pull requests only (plus a manual dispatch escape hatch) — a push to main would just repeat the
  # tier its own PR already ran. Gated on the two fast jobs so an obvious break fails in ~1 minute
  # instead of after the containers come up; `verify` re-runs the unit tier anyway.
  long:
    name: Long tier (integration + edition checks)
    needs: [ tiers, short ]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          #cache: maven
      - name: Unit + integration tests
        run: mvn -B verify -DskipITs=false
      - name: Edition separation - packaged jars, SPI manifest, community CLI behavior
        run: bash test-flow/check-editions.sh
      - name: Edition separation - banned-dependency enforcer gate
        run: bash test-flow/check-enforcer-gate.sh
      # Dev mode: asserts what ships (attribution, licensing, no credential-carrying module) but
      # lets ${revision} stay a snapshot. RELEASING.md runs it with --release at release time.
      - name: Release readiness - jar contents and licensing
        run: bash test-flow/check-release-ready.sh

  # The enterprise edition builds against whatever community snapshot is on SRDC Nexus, so main's
  # snapshot is republished after every push that passed the short tier. Needs the NEXUS_USERNAME /
  # NEXUS_PASSWORD repository secrets; without them the job says so and succeeds, rather than turning
  # main red on a fork or before the secrets are configured.
  deploy-snapshot:
    name: Deploy snapshot to SRDC Nexus
    needs: [ tiers, short ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Deploy
        run: |
          if [ -z "$NEXUS_USERNAME" ] || [ -z "$NEXUS_PASSWORD" ]; then
            echo "::warning::NEXUS_USERNAME/NEXUS_PASSWORD secrets are not set; skipping the snapshot deploy"
            exit 0
          fi
          case "$(grep -m1 -oE '<revision>[^<]+</revision>' pom.xml)" in
            *-SNAPSHOT*) ;;
            *) echo "::notice::\${revision} is a release version; releases are deployed by hand (RELEASING.md)"; exit 0 ;;
          esac
          mvn -B -s .github/maven-settings.xml -DskipTests deploy
