# Ignifyr configurations (runtime-streaming suites; mappings/schemas come from ignifyr-testkit).
# Without this, IgnifyrTestSpec resolves the default "mappings"/"schemas" folders, which are not on
# the test classpath, and the integration suites abort at construction.
ignifyr {

  # Base for relative file-system readings within a mapping job.
  context-path = "testcontext"

  mappings = {
    # The repository where the mapping definitions are kept (shipped by ignifyr-testkit).
    repository = {
      folder-path = "/test-mappings"
    }

    # Configuration of the schemas used in the mapping definitions (shipped by ignifyr-testkit).
    schemas = {
      repository = {
        folder-path = "/test-schemas"
      }
    }

    # Timeout for each mapping execution on an individual input record
    timeout = 5 seconds
  }

  archiving = {
    erroneous-records-folder = "erroneous-records-folder"
    archive-folder = "archive-folder"
    stream-archiving-frequency = 5000
  }

  # Settings for FHIR repository writer
  fhir-server-writer {
    batch-group-size = 20
  }

  # Database folder of Ignifyr
  db = "db"
}

# Spark configurations
spark = {
  app.name = "Ignifyr runtime-streaming TEST"
  master = "local[4]"
  # Streaming query checkpoints (StreamingFolderWatchTest / KafkaStreamingRedcapTest isolate per jobId).
  checkpoint-dir = "checkpoint"
}

akka = {
  daemonic = "on"
}
