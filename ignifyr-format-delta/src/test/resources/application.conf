# Ignifyr configurations (format-delta suites). The Delta Spark-session extension + catalog are
# contributed by DeltaFormatExtension.sparkConfContributions, not configured here.
ignifyr {

  context-path = "testcontext"

  mappings = {
    repository = {
      folder-path = "/test-mappings"
    }
    schemas = {
      repository = {
        folder-path = "/test-schemas"
      }
    }
    timeout = 5 seconds
  }

  fhir-server-writer {
    batch-group-size = 20
  }

  db = "db"
}

# Spark configurations
spark = {
  app.name = "Ignifyr format-delta TEST"
  master = "local[4]"
  checkpoint-dir = "checkpoint"
}

akka = {
  daemonic = "on"
}
